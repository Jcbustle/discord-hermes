name: iowap
repo: https://github.com/iowap-org/iowap-hermes-integration
sha: 6ca7224380112f233a70b71bba26c9a352eac80f
description: >-
  Fleet control for Hermes Desktop: live statusbar chip (N/M IOWAP nodes online),
  a draggable fleet pane, a full fleet page (status, load, queue depth,
  capabilities per node, activity) and a tasks page that submits to any
  task-type capability on the fleet and tracks submitted tasks live
  (per-stage status dots, result previews, artifacts). Data stays local via
  the local node-cli against your own IOWAP relay; agent sessions join through
  an optional iowap-task bridge into a shared track store.
maintainer: Kesuek
